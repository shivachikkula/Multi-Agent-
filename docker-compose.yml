services:
  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: agent
      POSTGRES_PASSWORD: agent
      POSTGRES_DB: agentdb
    ports: ["5432:5432"]
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agent -d agentdb"]
      interval: 5s
      timeout: 3s
      retries: 5

  orchestrator:
    build:
      context: .
      dockerfile: services/orchestrator/Dockerfile
    env_file: .env
    environment:
      SQL_DATABASE_URL: postgresql+asyncpg://agent:agent@postgres:5432/agentdb
      REDIS_URL: redis://redis:6379/0
    ports: ["8001:8001"]
    depends_on:
      redis: { condition: service_healthy }
      postgres: { condition: service_healthy }

  worker:
    build:
      context: .
      dockerfile: services/worker/Dockerfile
    env_file: .env
    environment:
      REDIS_URL: redis://redis:6379/0
    ports: ["8002:8002"]
    depends_on:
      redis: { condition: service_healthy }

  gateway:
    build:
      context: .
      dockerfile: services/gateway/Dockerfile
    env_file: .env
    environment:
      REDIS_URL: redis://redis:6379/0
      ORCHESTRATOR_BASE_URL: http://orchestrator:8001
    ports: ["8000:8000"]
    depends_on:
      redis: { condition: service_healthy }
      orchestrator:
        condition: service_started

volumes:
  pgdata:
